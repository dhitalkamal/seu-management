[project]
name = "management-service"
version = "0.1.0"
description = "Organisation and volunteer management service for the Sansaar platform."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "psycopg2-binary",
    "django-cors-headers",
    "python-decouple",
    "gunicorn",
    "redis",
    "cryptography>=42.0.0",
    "pika",
    "drf-spectacular",
    "boto3>=1.34",
    "geopy>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
exclude = ["*/migrations/*"]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.*.infrastructure.models", "apps.*.infrastructure.support_models", "apps.compliance.models"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["apps.*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["apps.common.*", "config.settings.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "apps.orgs.application.use_cases.update_ticket_status",
    "apps.orgs.application.use_cases.list_tickets",
    "apps.orgs.application.use_cases.create_ticket",
    "apps.orgs.management.commands.consume_events",
    "apps.orgs.presentation.views",
    "apps.orgs.presentation.support_views",
    "apps.venues.presentation.views",
    "apps.marketing.presentation.views",
    "apps.community.presentation.views",
    "apps.moderation.presentation.views",
    "apps.moderation.tests.unit.fakes",
    "apps.compliance.presentation.views",
]
ignore_errors = true
